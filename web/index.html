<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>No Alibi</title>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 18h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.4M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M4 7h16M6 7l-3 7a3 3 0 0 0 6 0L6 7zM18 7l-3 7a3 3 0 0 0 6 0l-3-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V12M14 11.5V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-.5a6 6 0 0 1-5-2.7L3 15.5a1.6 1.6 0 0 1 2.6-1.8L8 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
</svg>

<header class="topbar">
  <a class="brand" href="#/" aria-label="No Alibi home">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">No&nbsp;Alibi</span>
  </a>
  <nav class="topnav" aria-label="Main">
    <a href="#/" data-nav="home">New audit</a>
    <a href="#/runs" data-nav="runs">Case files</a>
  </nav>
  <div class="topbar-right">
    <div id="sys" class="sys" role="status" aria-label="System status"></div>
    <button id="theme" class="icon-btn" type="button" aria-label="Switch color theme" title="Switch theme (T)"><svg><use href="#i-moon"/></svg></button>
    <button id="help-btn" class="icon-btn" type="button" aria-label="Keyboard shortcuts" title="Shortcuts (?)"><svg><use href="#i-q"/></svg></button>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="toasts" class="toasts" aria-live="assertive"></div>

<dialog id="confirm" class="dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="dialog-actions">
      <button value="cancel" class="btn ghost" type="submit">Cancel</button>
      <button value="ok" class="btn primary" type="submit" id="confirm-ok">Continue</button>
    </div>
  </form>
</dialog>

<dialog id="help" class="dialog" aria-labelledby="help-title">
  <form method="dialog">
    <h2 id="help-title">Keyboard shortcuts</h2>
    <dl class="keys">
      <dt><kbd>/</kbd></dt><dd>Search apps</dd>
      <dt><kbd>M</kbd> or <kbd>Space</kbd></dt><dd>"I just used the AI feature" (during an audit)</dd>
      <dt><kbd>S</kbd></dt><dd>Stop and deliver the verdict</dd>
      <dt><kbd>T</kbd></dt><dd>Switch light / dark theme</dd>
      <dt><kbd>?</kbd></dt><dd>This list</dd>
      <dt><kbd>Esc</kbd></dt><dd>Close a dialog or panel</dd>
    </dl>
    <div class="dialog-actions"><button class="btn primary" type="submit">Got it</button></div>
  </form>
</dialog>

<script src="/static/app.js" type="module"></script>
</body>
</html>
