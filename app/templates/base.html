<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}No Alibi{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
    --accent: #1f4fd1; --accent-text: #ffffff;
    --red: #c42b1c; --red-bg: #fde8e6; --amber: #9a5b00; --amber-bg: #fff1d6;
    --green: #1e7a3c; --green-bg: #e3f4e8; --violet: #6236c4; --violet-bg: #eee7fb;
    --grey-bg: #efefec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d20; --text: #ededf0; --muted: #a0a0a8; --line: #2e2e33;
      --accent: #6d8dff; --accent-text: #0d0d10;
      --red: #ff7a6b; --red-bg: #3a1a17; --amber: #ffc25c; --amber-bg: #33270f;
      --green: #6fd38f; --green-bg: #15301e; --violet: #b59cff; --violet-bg: #261c3d;
      --grey-bg: #26262a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header.top {
    display: flex; align-items: baseline; gap: 12px; padding: 14px 24px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header.top a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 20px; }
  header.top span { color: var(--muted); font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
  }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  label small { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=number] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
  button, .button {
    display: inline-block; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit;
    font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-text);
    text-decoration: none;
  }
  button.secondary { background: var(--grey-bg); color: var(--text); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .error { background: var(--red-bg); color: var(--red); padding: 10px 14px; border-radius: 8px; }
  .warn { background: var(--amber-bg); color: var(--amber); padding: 8px 12px; border-radius: 8px;
          margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.domain { overflow-wrap: anywhere; font-family: ui-monospace, Consolas, monospace; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px;
          font-weight: 600; white-space: nowrap; }
  .cat-ai_provider { background: var(--red-bg); color: var(--red); }
  .cat-tracker, .cat-analytics, .cat-error_reporting { background: var(--amber-bg); color: var(--amber); }
  .cat-unknown { background: var(--violet-bg); color: var(--violet); }
  .cat-first_party, .cat-update { background: var(--green-bg); color: var(--green); }
  .ph-user_action { background: var(--amber-bg); color: var(--amber); }
  .ph-startup, .ph-idle { background: var(--grey-bg); color: var(--muted); }
  tr.hl-user_action td { background: color-mix(in srgb, var(--amber-bg) 60%, transparent); }
</style>
</head>
<body>
<header class="top"><a href="/">No Alibi</a><span>does the app keep its privacy promises?</span></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
